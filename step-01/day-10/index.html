
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Day 10 portfolio practice for my 87-Day AI Full-Stack Developer journey."
    >

    <title>Day 10 - Portfolio Practice</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>My Portfolio</h1>

        <nav aria-label="Main navigation">
            <a href="#main-content">Main Content</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
            <a href="#page-footer">Footer</a>
        </nav>
    </header>

    <main id="main-content">

        <section id="about">
            <h2>About Me</h2>

            <p>
                I am learning AI and full-stack development
                through my 87-day coding journey.
            </p>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>

            <form>

                <div>
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>
        </section>

    </main>

    <footer id="page-footer">
        <p>&copy; 2026 My Portfolio</p>
    </footer>

</body>

</html>
