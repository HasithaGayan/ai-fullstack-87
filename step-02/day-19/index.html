
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Day 19 - Weather Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>

<body>

  <main class="weather-app">

    <header class="app-header">
      <h1>🌤️ Weather Dashboard</h1>
      <p>Search for a city to check the current weather.</p>
    </header>

    <!-- City search -->
    <form id="weather-form">

      <label for="city-input">City Name</label>

      <div class="search-group">
        <input
          type="search"
          id="city-input"
          placeholder="Enter a city, e.g. Colombo"
          maxlength="100"
          autocomplete="off"
          required
        >

        <button type="submit" id="search-button">
          🔍 Search
        </button>
      </div>

      <!-- NEW: Optional geolocation button -->
      <button type="button" id="location-button">
        📍 Use My Location
      </button>

    </form>

    <p id="status" role="status" aria-live="polite">
      Enter a city and click Search.
    </p>

    <!-- Weather results -->
    <section id="weather-result" hidden>

      <h2 id="location-name">City Name</h2>

      <div class="weather-main">
        <span id="weather-icon" aria-hidden="true">☀️</span>
        <p id="temperature">--°C</p>
      </div>

      <p id="weather-description">
        Weather condition
      </p>

      <div class="weather-details">

        <div class="detail-card">
          <span>💧 Humidity</span>
          <strong id="humidity">--%</strong>
        </div>

        <div class="detail-card">
          <span>💨 Wind Speed</span>
          <strong id="wind-speed">-- km/h</strong>
        </div>

      </div>

    </section>

  </main>

</body>
</html>
